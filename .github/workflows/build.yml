name: Build and Push Docker Image

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
          contents: write
          packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Check version change
              id: version
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
                  
                  # Get the previous commit's package.json version
                  if git rev-parse HEAD^ >/dev/null 2>&1; then
                    PREVIOUS_VERSION=$(git show HEAD^:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" 2>/dev/null || echo "0.0.0")
                  else
                    PREVIOUS_VERSION="0.0.0"
                  fi
                  echo "previous=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
                  
                  echo "Current version: $CURRENT_VERSION"
                  echo "Previous version: $PREVIOUS_VERSION"
                  
                  if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
                    # Validate version increased using semver comparison
                    VERSION_VALID=$(node -e "
                      const curr = '$CURRENT_VERSION'.split('.').map(Number);
                      const prev = '$PREVIOUS_VERSION'.split('.').map(Number);
                      const isValid = curr[0] > prev[0] || 
                        (curr[0] === prev[0] && curr[1] > prev[1]) ||
                        (curr[0] === prev[0] && curr[1] === prev[1] && curr[2] > prev[2]);
                      console.log(isValid ? 'true' : 'false');
                    ")
                    
                    if [ "$VERSION_VALID" = "true" ]; then
                      echo "changed=true" >> $GITHUB_OUTPUT
                      echo "Version increased from $PREVIOUS_VERSION to $CURRENT_VERSION"
                    else
                      echo "changed=false" >> $GITHUB_OUTPUT
                      echo "::warning::Version must increase to trigger a release! Current ($CURRENT_VERSION) is not greater than previous ($PREVIOUS_VERSION)"
                    fi
                  else
                    echo "changed=false" >> $GITHUB_OUTPUT
                    echo "Version unchanged"
                  fi

            - name: Install dependencies
              run: npm install

            - name: Restore Next.js cache
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      ${{ github.workspace }}/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

            - name: Build Next.js application
              run: npm run build
              env:
                  NEXT_TELEMETRY_DISABLED: 1
                  APP_VERSION: ${{ steps.version.outputs.current }}

            - name: Create zip archive of build
              if: github.event_name != 'pull_request' && steps.version.outputs.changed == 'true'
              run: |
                  cd .next
                  zip -r ../portfolio-build.zip .
                  cd ..

            - name: Create GitHub Release
              if: github.event_name != 'pull_request' && steps.version.outputs.changed == 'true'
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ steps.version.outputs.current }}
                  name: Portfolio v${{ steps.version.outputs.current }}
                  files: portfolio-build.zip
                  generate_release_notes: true
                  prerelease: ${{ github.ref != 'refs/heads/master' }}

            - name: Cache Docker layers
              uses: actions/cache@v4
              with:
                  path: /tmp/.buildx-cache
                  key: ${{ runner.os }}-buildx-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-buildx-

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            
            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request' && steps.version.outputs.changed == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/portfolio-reworked
                  tags: |
                      type=ref,event=branch
                      type=sha,format=short
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=raw,value=${{ github.ref_name }},enable=true
                      type=raw,value=v${{ steps.version.outputs.current }},enable=${{ steps.version.outputs.changed == 'true' }}
            
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./DockerFile
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name != 'pull_request' && steps.version.outputs.changed == 'true' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: |
                      type=gha
                      type=local,src=/tmp/.buildx-cache
                  cache-to: |
                      type=gha,mode=max
                      type=local,dest=/tmp/.buildx-cache-new,mode=max

            - name: Move cache
              if: always()
              run: |
                  rm -rf /tmp/.buildx-cache
                  if [ -d /tmp/.buildx-cache-new ]; then
                    mv /tmp/.buildx-cache-new /tmp/.buildx-cache
                  fi

            - name: Create and push git tag with SHA
              if: github.event_name != 'pull_request' && steps.version.outputs.changed == 'true'
              run: |
                  TAG_NAME=sha-${GITHUB_SHA::7}
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git config url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
                  git tag $TAG_NAME || true
                  git push origin $TAG_NAME || true
                  echo "Created and pushed tag: ${TAG_NAME}" 
